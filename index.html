<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ISG · Dashboard de Indicadores</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
body { background:#0A0A0A; color:#fff; font-family:-apple-system,'Helvetica Neue',Arial,sans-serif; min-height:100vh; }
button { cursor:pointer; font-family:inherit; }

/* LOADING */
#loading { position:fixed; inset:0; background:#0A0A0A; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:9999; gap:16px; }
.spinner { width:40px; height:40px; border:3px solid #1E1E1E; border-top-color:#7DC655; border-radius:50%; animation:spin 0.8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.load-text { color:#888; font-size:13px; }
.load-sub { color:#444; font-size:11px; }

/* HEADER */
.header { background:#111; border-bottom:1px solid #1E1E1E; padding:0 16px; position:sticky; top:0; z-index:100; }
.header-inner { display:flex; align-items:center; justify-content:space-between; min-height:52px; gap:10px; flex-wrap:wrap; padding:8px 0; }
.header-left { display:flex; align-items:center; gap:12px; }
.header-accent { width:5px; height:26px; background:#7DC655; border-radius:3px; flex-shrink:0; }
.header-title { font-weight:800; font-size:14px; letter-spacing:-0.01em; }
.header-sub { font-size:10px; color:#888; margin-top:1px; }
.vista-toggle { display:flex; background:#161616; border:1px solid #1E1E1E; border-radius:8px; overflow:hidden; }
.vista-btn { padding:7px 14px; border:none; font-size:12px; font-weight:600; transition:all 0.15s; }
.vista-btn.active { background:#2D7A2D; color:#fff; }
.vista-btn.inactive { background:none; color:#888; }
.refresh-btn { background:#161616; border:1px solid #1E1E1E; color:#888; border-radius:8px; padding:7px 12px; font-size:11px; display:flex; align-items:center; gap:5px; }
.refresh-btn:hover { border-color:#2D7A2D; color:#7DC655; }

/* BANNER */
.banner { background:#0D1A0D; border-bottom:1px solid #2D7A2D44; padding:8px 16px; display:flex; gap:8px; align-items:center; overflow-x:auto; -webkit-overflow-scrolling:touch; flex-wrap:nowrap; }
.banner::-webkit-scrollbar { display:none; }
.banner-label { font-size:11px; color:#7DC655; font-weight:700; white-space:nowrap; }
.opp-chip { border:none; border-radius:20px; padding:5px 12px; display:flex; align-items:center; gap:5px; white-space:nowrap; }

/* LAYOUT */
.layout { display:grid; grid-template-columns:260px 1fr; min-height:calc(100vh - 112px); }
.sidebar { background:#111; border-right:1px solid #1E1E1E; padding:14px; overflow-y:auto; max-height:calc(100vh - 112px); }
.sidebar-label { font-size:10px; color:#888; text-transform:uppercase; letter-spacing:0.08em; margin-bottom:10px; font-weight:600; }
.detail { padding:20px; overflow-y:auto; max-height:calc(100vh - 112px); }

/* SUCURSAL CARD */
.suc-card { border-radius:10px; padding:12px 14px; transition:all 0.15s; margin-bottom:8px; border:1px solid #1E1E1E; background:#111; cursor:pointer; }
.suc-card.selected { border-color:#7DC655; background:#1A1A1A; outline:2px solid #2D7A2D; }
.suc-card-top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px; gap:8px; }
.suc-name { font-weight:700; color:#fff; font-size:12px; }
.badge { font-size:10px; font-weight:700; border-radius:20px; padding:2px 8px; white-space:nowrap; flex-shrink:0; }
.suc-counts { display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
.suc-count { font-size:10px; }
.kpi-bars { display:flex; gap:2px; }
.kpi-bar { flex:1; height:4px; border-radius:2px; }

/* KPI GRID */
.kpi-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(145px,1fr)); gap:10px; }
.kpi-chip { border-radius:8px; padding:10px 12px; display:flex; flex-direction:column; gap:2px; }
.kpi-label { font-size:10px; color:#888; letter-spacing:0.05em; text-transform:uppercase; font-family:monospace; }
.kpi-val { font-size:20px; font-weight:700; font-family:'Courier New',monospace; }
.kpi-obj { font-size:9px; color:#888; }
.kpi-bar-bg { height:3px; background:#222; border-radius:2px; margin-top:3px; }
.kpi-bar-fill { height:3px; border-radius:2px; }

.section-hdr { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.section-badge { padding:4px 14px; border-radius:20px; font-weight:700; font-size:12px; letter-spacing:0.05em; }
.section-line { flex:1; height:1px; background:#1E1E1E; }

.detail-head { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:20px; gap:12px; }
.detail-title { font-size:20px; font-weight:800; letter-spacing:-0.02em; }
.detail-sub { font-size:11px; color:#888; margin-top:3px; }

/* OPP ROWS */
.opp-row { display:flex; align-items:center; gap:10px; background:#161616; border-radius:8px; padding:10px 12px; border:1px solid #1E1E1E; flex-wrap:wrap; }
.opp-grupo { font-size:10px; font-weight:700; border-radius:4px; padding:2px 6px; white-space:nowrap; }
.opp-label { font-size:12px; color:#fff; flex:1; min-width:100px; }
.opp-right { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.opp-bar-bg { width:60px; height:6px; background:#222; border-radius:3px; }
.opp-bar-fill { height:6px; border-radius:3px; }

/* TABLE */
.table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
table { width:100%; border-collapse:collapse; font-size:12px; }
th { padding:8px; font-weight:600; border-bottom:1px solid #1E1E1E; text-align:center; font-size:10px; white-space:nowrap; }
th.sticky { text-align:left; padding-left:12px; position:sticky; left:0; background:#0A0A0A; z-index:2; }
td { padding:9px 8px; text-align:center; border-bottom:1px solid #1E1E1E22; }
td.sticky { text-align:left; padding-left:12px; position:sticky; left:0; background:#0A0A0A; font-weight:600; font-size:11px; z-index:2; white-space:nowrap; }
.cell-val { display:inline-block; padding:3px 8px; border-radius:6px; font-family:'Courier New',monospace; font-weight:700; font-size:11px; }

/* LICENCIAS TABLE */
.lic-table th { background:#111; }
.lic-estado { padding:3px 10px; border-radius:20px; font-size:10px; font-weight:700; }

/* INFO CARDS */
.info-card { background:#111; border:1px solid #1E1E1E; border-radius:10px; padding:14px 16px; }
.info-card-title { font-size:11px; color:#888; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:10px; font-weight:600; }

/* ERROR */
.error-box { background:#1A0A0A; border:1px solid #E05252; border-radius:10px; padding:20px; text-align:center; color:#E05252; }

/* MOBILE */
@media(max-width:700px){
  .layout { grid-template-columns:1fr; }
  .sidebar { border-right:none; border-bottom:1px solid #1E1E1E; max-height:none; }
  .detail { padding:14px; max-height:none; }
  .kpi-grid { grid-template-columns:repeat(2,1fr); }
  .detail-title { font-size:16px; }
  .semana-wrap { display:none; }
}
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div class="load-text">Cargando dashboard ISG...</div>
  <div class="load-sub" id="load-sub">Conectando con OneDrive</div>
</div>

<div id="app" style="display:none;"></div>

<script>
// ── CONFIGURACIÓN ONEDRIVE ────────────────────────────────────────────────────
// URL base del archivo en SharePoint/OneDrive
const SHAREPOINT_URL = "https://agronortesantafe-my.sharepoint.com/:x:/g/personal/regalinialejandro_agronorte_com_ar/IQD7JT4ch6mlSr4EHfl7GhbiAXRW8PDus4AFRvl-RkbL_A0";

// URL de descarga directa
const DOWNLOAD_URL = "https://raw.githubusercontent.com/aleregalini7488/isg-dashboard/main/ISG_Dashboard_Data_2.xlsx";

// ── ESTADO GLOBAL ─────────────────────────────────────────────────────────────
let DATA = null;
let selectedId = null;
let vista = "detalle";
let lastUpdate = null;

// ── COLORES ───────────────────────────────────────────────────────────────────
const C = {
  green:"#7DC655", yellow:"#F5C842", red:"#E05252", grey:"#888",
  greenBg:"#0A1A0A", yellowBg:"#1A1500", redBg:"#1A0A0A", greenDk:"#2D7A2D"
};
function sColor(st){ return C[st]||C.grey; }
function sBg(st){ return C[st+"Bg"]||"#111"; }

function semaforo(val, obj){
  if(val===null||val===undefined||obj===null||obj===undefined) return "neutral";
  if(val>=obj) return "green";
  if(val>=obj*0.85) return "yellow";
  return "red";
}

// ── LEER EXCEL DESDE ONEDRIVE ─────────────────────────────────────────────────
async function fetchExcel(){
  
  
  // Intentar con la URL de descarga directa via proxy CORS
  const proxyUrl = DOWNLOAD_URL;
  
  const response = await fetch(proxyUrl);
  if(!response.ok) throw new Error(`HTTP ${response.status}`);
  
  const buffer = await response.arrayBuffer();
  return buffer;
}

// ── PARSEAR EXCEL CON SHEETJS ─────────────────────────────────────────────────
function parseExcel(buffer){
  const wb = XLSX.read(buffer, {type:"array", cellDates:true});
  
  // SUCURSALES
  const wsSuc = wb.Sheets["SUCURSALES"];
  const rawSuc = XLSX.utils.sheet_to_json(wsSuc, {header:1, defval:null});
  
  // Cabeceras en fila 3 (índice 2), datos desde fila 4 (índice 3)
  const sucursales = [];
  for(let i=3; i<rawSuc.length; i++){
    const r = rawSuc[i];
    if(!r[0] || typeof r[0] !== "string") continue;
    sucursales.push({
      id: i-2,
      nombre:   r[0],
      ha_opp:   r[1]  || 0,
      ha_conn:  r[2]  || 0,
      pct_conn: typeof r[3]==="number" ? r[3] : null,
      obj_conn: { Q1:r[4], Q2:r[5], Q3:r[6], Q4:r[7] },
      ha_heh:   r[8]  || 0,
      pct_heh:  typeof r[9]==="number" ? r[9] : null,
      obj_heh:  { Q1:r[10], Q2:r[11], Q3:r[12], Q4:r[13] },
      pct_cosecha:    r[14]||null, obj_cosecha:   {Q1:r[15],Q2:r[16],Q3:r[17],Q4:r[18]},
      pct_spray:      r[19]||null, obj_spray:     {Q1:r[20],Q2:r[21],Q3:r[22],Q4:r[23]},
      pct_sia:        r[24]||null, obj_sia:       {Q1:r[25],Q2:r[26],Q3:r[27],Q4:r[28]},
      pct_incpro:     r[29]||null, obj_incpro:    {Q1:r[30],Q2:r[31],Q3:r[32],Q4:r[33]},
      pct_ea:         r[34]||null, obj_ea:        {Q1:r[35],Q2:r[36],Q3:r[37],Q4:r[38]},
      pct_sc:         r[39]||null, obj_sc:        {Q1:r[40],Q2:r[41],Q3:r[42],Q4:r[43]},
      pct_autotrac:   r[44]||null, obj_autotrac:  {Q1:r[45],Q2:r[46],Q3:r[47],Q4:r[48]},
      semana: r[49]||"",
    });
  }

  // CONFIG
  const wsCfg = wb.Sheets["CONFIG"];
  const rawCfg = XLSX.utils.sheet_to_json(wsCfg, {header:1, defval:null});
  const config = {};
  for(let i=2; i<rawCfg.length; i++){
    if(rawCfg[i][0]) config[rawCfg[i][0]] = rawCfg[i][1];
  }

  // DISPOSITIVOS — resumen por sucursal
  const wsDisp = wb.Sheets["DISPOSITIVOS"];
  const rawDisp = XLSX.utils.sheet_to_json(wsDisp, {header:1, defval:null});
  const dispPorSuc = {};
  for(let i=2; i<rawDisp.length; i++){
    const r = rawDisp[i];
    if(!r[2] || r[0]==="TOTAL ISG") continue;
    const suc = r[2];
    if(!dispPorSuc[suc]) dispPorSuc[suc]={orgs:0,monitores:0,receptores:0,modems:0,modems_activos:0,total:0};
    dispPorSuc[suc].orgs++;
    dispPorSuc[suc].monitores    += r[5]||0;
    dispPorSuc[suc].receptores   += r[6]||0;
    dispPorSuc[suc].modems       += r[7]||0;
    dispPorSuc[suc].modems_activos += r[8]||0;
    dispPorSuc[suc].total        += r[9]||0;
  }

  // LICENCIAS
  const wsLic = wb.Sheets["LICENCIAS"];
  const rawLic = XLSX.utils.sheet_to_json(wsLic, {header:1, defval:null});
  const licencias = [];
  for(let i=2; i<rawLic.length; i++){
    const r = rawLic[i];
    if(!r[0]) continue;
    licencias.push({
      ns: r[0], modelo: r[1], org_id: r[2], org_nombre: r[3],
      sucursal: r[4], tipo: r[5], fecha_venc: r[6],
      dias: r[7], estado: r[8], accion: r[9],
    });
  }

  return { sucursales, config, dispPorSuc, licencias };
}

// ── SCORE OPORTUNIDAD ─────────────────────────────────────────────────────────
function getObj(suc, kpi, trimestre){
  const t = trimestre || "Q3";
  const key = "obj_" + kpi;
  return suc[key] ? suc[key][t] : null;
}

function oppScore(suc, trimestre){
  const kpis = ["conn","heh","cosecha","spray","sia","incpro","ea","sc","autotrac"];
  const vals  = [suc.pct_conn, suc.pct_heh, suc.pct_cosecha, suc.pct_spray,
                 suc.pct_sia, suc.pct_incpro, suc.pct_ea, suc.pct_sc, suc.pct_autotrac];
  let total=0, count=0;
  kpis.forEach((k,i)=>{
    const v=vals[i]; const obj=getObj(suc,k,trimestre);
    if(v!==null&&v!==undefined&&obj!==null&&obj!==undefined){ total+=Math.max(0,obj-v); count++; }
  });
  return count ? total/count : 0;
}

function urgencia(sc){ return sc>15?"red":sc>5?"yellow":"green"; }
function sorted(){ return [...DATA.sucursales].sort((a,b)=>oppScore(b,DATA.config.Trimestre_Activo)-oppScore(a,DATA.config.Trimestre_Activo)); }

// ── RENDER ────────────────────────────────────────────────────────────────────
function render(){
  const app = document.getElementById("app");
  const suc = DATA.sucursales.find(s=>s.id===selectedId);
  const trimestre = DATA.config.Trimestre_Activo || "Q3";
  const semana = DATA.config.Semana_Actual || "";

  app.innerHTML = buildHeader(semana) + buildBanner(trimestre) +
    (vista==="consolidada" ? buildConsolidado(trimestre) :
     vista==="dispositivos" ? buildDispositivos() :
     vista==="licencias" ? buildLicencias() :
     buildDetalle(suc, trimestre));
  attachEvents();
}

function buildHeader(semana){
  return `
  <div class="header">
    <div class="header-inner">
      <div class="header-left">
        <div class="header-accent"></div>
        <div>
          <div class="header-title">${DATA.config.Título||"ISG · Dashboard"}</div>
          <div class="header-sub">${DATA.config.Subtítulo||""} · ${semana} · Act: ${DATA.config.Fecha_Actualizacion||""}</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <button class="refresh-btn" onclick="refreshData()">↻ Actualizar</button>
        <div class="vista-toggle">
          <button class="vista-btn ${vista==='detalle'?'active':'inactive'}" onclick="setVista('detalle')">Sucursales</button>
          <button class="vista-btn ${vista==='consolidada'?'active':'inactive'}" onclick="setVista('consolidada')">Consolidado</button>
          <button class="vista-btn ${vista==='dispositivos'?'active':'inactive'}" onclick="setVista('dispositivos')">Dispositivos</button>
          <button class="vista-btn ${vista==='licencias'?'active':'inactive'}" onclick="setVista('licencias')">Licencias</button>
        </div>
      </div>
    </div>
  </div>`;
}

function buildBanner(trimestre){
  const top3 = sorted().slice(0,3);
  return `
  <div class="banner">
    <span class="banner-label">🎯 TOP OPORTUNIDADES ${trimestre}:</span>
    ${top3.map((s,i)=>{
      const sc=oppScore(s,trimestre); const urg=urgencia(sc);
      return `<button class="opp-chip" style="background:${sBg(urg)};border:1px solid ${sColor(urg)}44;" onclick="selectSuc(${s.id})">
        <span style="color:${sColor(urg)};font-weight:700;font-size:11px;">#${i+1}</span>
        <span style="color:#fff;font-size:11px;">${s.nombre}</span>
        <span style="color:#888;font-size:10px;">score ${sc.toFixed(1)}</span>
      </button>`;
    }).join("")}
    <span style="margin-left:auto;font-size:10px;color:#444;white-space:nowrap;">Trimestre activo: <strong style="color:#888;">${trimestre}</strong></span>
  </div>`;
}

function buildDetalle(suc, trimestre){
  return `
  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-label">Sucursales · ord. por oportunidad</div>
      ${sorted().map(s=>buildSucCard(s,trimestre)).join("")}
    </div>
    <div class="detail">${suc ? buildDetalleSuc(suc,trimestre) : "<div style='color:#555;padding:40px;text-align:center;'>Seleccioná una sucursal</div>"}</div>
  </div>`;
}

function buildSucCard(s, trimestre){
  const sc=oppScore(s,trimestre); const urg=urgencia(sc); const sel=s.id===selectedId;
  const stConn=semaforo(s.pct_conn, getObj(s,"conn",trimestre));
  const stHeh=semaforo(s.pct_heh, getObj(s,"heh",trimestre));
  const urgLabel=urg==="red"?"⚠ Oportunidad":urg==="yellow"?"~ Atención":"✓ En línea";
  return `
  <div class="suc-card${sel?" selected":""}" onclick="selectSuc(${s.id})">
    <div class="suc-card-top">
      <span class="suc-name">${s.nombre}</span>
      <span class="badge" style="background:${sBg(urg)};color:${sColor(urg)};border:1px solid ${sColor(urg)}44;">${urgLabel}</span>
    </div>
    <div class="suc-counts">
      <span class="suc-count" style="color:${sColor(stConn)};">Ha Conn: ${s.pct_conn!==null?s.pct_conn.toFixed(1)+"%" :"—"}</span>
      <span class="suc-count" style="color:${sColor(stHeh)};">Alt: ${s.pct_heh!==null?s.pct_heh.toFixed(1)+"%":"—"}</span>
    </div>
    <div class="kpi-bars">
      <div class="kpi-bar" style="background:${sColor(stConn)};opacity:0.85;"></div>
      <div class="kpi-bar" style="background:${sColor(stHeh)};opacity:0.85;"></div>
    </div>
  </div>`;
}

function kpiChip(label, val, obj, unit="%"){
  const st = semaforo(val, obj);
  const col = sColor(st); const bg = sBg(st);
  const display = val===null||val===undefined ? "—" : `${typeof val==="number"?val.toFixed(1):val}${unit}`;
  const pct = obj&&val!==null ? Math.min(100,Math.round((val/obj)*100)) : 0;
  return `
  <div class="kpi-chip" style="background:${bg};border:1px solid ${col}22;">
    <span class="kpi-label">${label}</span>
    <div style="display:flex;align-items:baseline;gap:4px;">
      <span class="kpi-val" style="color:${col};">${display}</span>
      ${obj?`<span class="kpi-obj">/ ${obj}${unit}</span>`:""}
    </div>
    ${obj&&val!==null?`<div class="kpi-bar-bg"><div class="kpi-bar-fill" style="width:${pct}%;background:${col};"></div></div>`:""}
  </div>`;
}

function buildDetalleSuc(suc, trimestre){
  const sc=oppScore(suc,trimestre); const urg=urgencia(sc);
  const disp=DATA.dispPorSuc[suc.nombre]||null;

  const kpisAdoption = [
    {label:"Ha Oportunidad", val:suc.ha_opp, obj:null, unit:" ha", isHa:true},
    {label:"Ha Conectadas", val:suc.ha_conn, obj:null, unit:" ha", isHa:true},
    {label:"% Ha Conn.", val:suc.pct_conn, obj:getObj(suc,"conn",trimestre)},
    {label:"Ha Alt. Conn.", val:suc.ha_heh, obj:null, unit:" ha", isHa:true},
    {label:"% Ha Alt. Conn.", val:suc.pct_heh, obj:getObj(suc,"heh",trimestre)},
    {label:"Tec. Cosecha", val:suc.pct_cosecha, obj:getObj(suc,"cosecha",trimestre)},
    {label:"Spray Tech", val:suc.pct_spray, obj:getObj(suc,"spray",trimestre)},
  ];
  const kpisUtil = [
    {label:"SIA",            val:suc.pct_sia,      obj:getObj(suc,"sia",trimestre)},
    {label:"INC PRO",        val:suc.pct_incpro,   obj:getObj(suc,"incpro",trimestre)},
    {label:"EA",             val:suc.pct_ea,        obj:getObj(suc,"ea",trimestre)},
    {label:"Section Control",val:suc.pct_sc,        obj:getObj(suc,"sc",trimestre)},
    {label:"AutoTrac",       val:suc.pct_autotrac,  obj:getObj(suc,"autotrac",trimestre)},
  ];

  // Gaps
  const allKpis=[
    {label:"Ha Conectadas %",val:suc.pct_conn,obj:getObj(suc,"conn",trimestre),grupo:"ADOPTION"},
    {label:"Ha Alt. Conectadas %",val:suc.pct_heh,obj:getObj(suc,"heh",trimestre),grupo:"ADOPTION"},
    {label:"Tec. Cosecha",val:suc.pct_cosecha,obj:getObj(suc,"cosecha",trimestre),grupo:"ADOPTION"},
    {label:"Spray Tech",val:suc.pct_spray,obj:getObj(suc,"spray",trimestre),grupo:"ADOPTION"},
    {label:"SIA",val:suc.pct_sia,obj:getObj(suc,"sia",trimestre),grupo:"UTILIZATION"},
    {label:"INC PRO",val:suc.pct_incpro,obj:getObj(suc,"incpro",trimestre),grupo:"UTILIZATION"},
    {label:"EA",val:suc.pct_ea,obj:getObj(suc,"ea",trimestre),grupo:"UTILIZATION"},
    {label:"Section Control",val:suc.pct_sc,obj:getObj(suc,"sc",trimestre),grupo:"UTILIZATION"},
    {label:"AutoTrac",val:suc.pct_autotrac,obj:getObj(suc,"autotrac",trimestre),grupo:"UTILIZATION"},
  ];
  const gaps=allKpis.filter(x=>x.obj&&x.val!==null&&x.val!==undefined&&x.val<x.obj).sort((a,b)=>(b.obj-b.val)-(a.obj-a.val));

  return `
  <div class="detail-head">
    <div>
      <div class="detail-title">${suc.nombre}</div>

  </div>

  <!-- ADOPTION -->
  <div style="margin-bottom:20px;">
    <div class="section-hdr">
      <div class="section-badge" style="background:#0A1A0A;border:1px solid #2D7A2D;color:#7DC655;">ADOPTION</div>
      <div class="section-line"></div>
    </div>
    <div class="kpi-grid">
      ${kpisAdoption.map(k=>kpiChip(k.label, k.val, k.obj, k.unit||"%")).join("")}
    </div>
  </div>

  <!-- UTILIZATION -->
  <div style="margin-bottom:20px;">
    <div class="section-hdr">
      <div class="section-badge" style="background:#1A1500;border:1px solid #F5C84244;color:#F5C842;">UTILIZATION · Crop Care</div>
      <div class="section-line"></div>
    </div>
    <div class="kpi-grid">
      ${kpisUtil.map(k=>kpiChip(k.label,k.val,k.obj)).join("")}
    </div>
  </div>

  <!-- DISPOSITIVOS SUCURSAL -->
  ${disp ? `
  <div style="margin-bottom:20px;">
    <div class="section-hdr">
      <div class="section-badge" style="background:#0A1A3A;border:1px solid #4488FF44;color:#7DC6FF;">DISPOSITIVOS</div>
      <div class="section-line"></div>
    </div>
    <div class="kpi-grid">
      ${kpiChip("Organizaciones", disp.orgs, null, "")}
      ${kpiChip("Monitores", disp.monitores, null, "")}
      ${kpiChip("Receptores", disp.receptores, null, "")}
      ${kpiChip("Modems MTG", disp.modems, null, "")}
      ${kpiChip("Modems Activos", disp.modems_activos, null, "")}
      ${kpiChip("Total Disp.", disp.total, null, "")}
    </div>
  </div>` : ""}

  <!-- OPORTUNIDADES -->
  <div class="info-card">
    <div class="info-card-title">Análisis de Oportunidades · ${trimestre}</div>
    <div style="display:flex;flex-direction:column;gap:8px;">
      ${gaps.length===0 ? `<div style="color:#7DC655;font-size:12px;">✓ Todos los KPIs en objetivo</div>` : ""}
      ${gaps.map(item=>{
        const gap=item.obj-item.val;
        const pct=Math.round((item.val/item.obj)*100);
        const col=gap>15?"#E05252":"#F5C842";
        const gbg=item.grupo==="ADOPTION"?"#0A1A0A":"#1A1500";
        const gcol=item.grupo==="ADOPTION"?"#7DC655":"#F5C842";
        return `<div class="opp-row">

            <span style="font-size:11px;font-family:'Courier New',monospace;font-weight:700;color:#fff;">${item.val.toFixed(1)}% / ${item.obj}%</span>
            <span style="font-size:11px;font-weight:700;color:${col};">−${gap.toFixed(1)}%</span>
          </div>
        </div>`;
      }).join("")}
      ${enObj.length>0 ? `<div style="font-size:12px;color:#7DC655;margin-top:4px;">✓ En objetivo: ${enObj.map(x=>x.label).join(", ")}</div>` : ""}
    </div>
  </div>`;
}

  const estBg={"VENCIDA":"#1A0A0A","CRÍTICA":"#1A0A0A","PRÓXIMA":"#1A1500","ACTIVA":"#0A1A0A","Sin fecha":"#111"};

        <div style="font-size:10px;color:#888;text-transform:uppercase;letter-spacing:0.05em;">${lbl}</div>
        <div style="font-size:28px;font-weight:800;color:${sColor(col)};font-family:'Courier New',monospace;">${n}</div>

    </div>
    <!-- Tabla -->
    <div class="info-card" style="overflow:hidden;">
      <div style="padding:14px 16px;border-bottom:1px solid #1E1E1E;">
        <span style="font-weight:700;font-size:14px;">Detalle de Licencias</span>

function attachEvents(){}
function setVista(v){ vista=v; render(); }
function selectSuc(id){ selectedId=id; if(vista!=="detalle") vista="detalle"; render();
  setTimeout(()=>{ const d=document.querySelector(".detail"); if(d&&window.innerWidth<=700) d.scrollIntoView({behavior:"smooth"}); },50);

async function refreshData(){
  document.getElementById("load-sub").textContent="Actualizando datos...";
  document.getElementById("loading").style.display="flex";
  document.getElementById("app").style.display="none";
  await loadAndRender();
}

// ── CARGA INICIAL ─────────────────────────────────────────────────────────────
async function loadAndRender(){
  try {
    document.getElementById("load-sub").textContent="Descargando Excel desde OneDrive...";
    const buffer = await fetchExcel();
    document.getElementById("load-sub").textContent="Procesando datos...";
    DATA = parseExcel(buffer);
    if(!selectedId && DATA.sucursales.length>0) selectedId=DATA.sucursales[0].id;
    lastUpdate = new Date();
    document.getElementById("loading").style.display="none";
    document.getElementById("app").style.display="block";
    render();
  } catch(err){
    document.getElementById("load-sub").textContent="Error: "+err.message;
    document.getElementById("loading").innerHTML=`
      <div style="text-align:center;padding:40px;">
        <div style="color:#E05252;font-size:16px;font-weight:700;margin-bottom:12px;">No se pudo cargar el archivo</div>
        <div style="color:#888;font-size:12px;margin-bottom:20px;">${err.message}</div>
        <div style="color:#555;font-size:11px;max-width:400px;line-height:1.6;">
          El archivo de OneDrive requiere autenticación.<br>
          Para usar el dashboard en modo offline, descargá el Excel y abrilo junto con este HTML en la misma carpeta.
        </div>
        <button onclick="loadOffline()" style="margin-top:20px;background:#2D7A2D;border:none;color:#fff;padding:10px 24px;border-radius:8px;font-size:13px;cursor:pointer;">
          📂 Cargar archivo local
        </button>
        <input type="file" id="file-input" accept=".xlsx" style="display:none;" onchange="handleFileUpload(event)">
      </div>`;
  }
}

function loadOffline(){ document.getElementById("file-input").click(); }

function handleFileUpload(e){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      document.getElementById("load-sub").textContent="Procesando archivo local...";
      DATA=parseExcel(ev.target.result);
      if(!selectedId&&DATA.sucursales.length>0) selectedId=DATA.sucursales[0].id;
      document.getElementById("loading").style.display="none";
      document.getElementById("app").style.display="block";
      render();
    }catch(err){
      alert("Error al procesar el archivo: "+err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}

// Cargar SheetJS y arrancar
const script=document.createElement("script");
script.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
script.onload=loadAndRender;
script.onerror=()=>{ document.getElementById("load-sub").textContent="Error cargando librería"; };
document.head.appendChild(script);
</script>
